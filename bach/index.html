<!doctype html>
<!--
  Perpetual Bach, version 1.1.0 (2026-10-20)
  English organ rework of 無限バッハ機関 (Bach Perpetuum Mobile) by Kōya Matsuo, MIT license
  1.1.0  Home keys per piece, key rotation near home, Buxtehude key plan for the passacaglia
  1.0.0  First release: organ player, three-voice display, About page, manuscript background
-->
<html lang="en">
  <head>
    <meta name="version" content="1.1.0" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bach Perpetuum Mobile</title>
    <style>
      :root {
        --paper: #ece6da;
        --card: #f8f4ec;
        --ink: #2a2620;
        --ink-2: #6b6357;
        --ink-3: #a1988a;
        --warm: #c98a3a;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; color: var(--ink); background: var(--paper); }
      body { font-family: var(--serif); font-size: 16px; -webkit-font-smoothing: antialiased; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
        background: radial-gradient(120% 90% at 50% 0%, #f3eee4 0%, var(--paper) 60%, #e3dccd 100%); }
      /* A faded Bach manuscript behind the page, never behind the player */
      body::before { content: ""; position: fixed; inset: -12px; z-index: 0; pointer-events: none;
        background-image: var(--bg-img); background-size: auto max(104vh, 640px); background-repeat: repeat-x; background-position: center top;
        opacity: 0.15; filter: sepia(0.6) blur(0.4px);
        -webkit-mask-image: radial-gradient(ellipse 80% 75% at 50% 50%, rgba(0,0,0,0.35) 0%, #000 70%); mask-image: radial-gradient(ellipse 80% 75% at 50% 50%, rgba(0,0,0,0.35) 0%, #000 70%); }
      button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
      button:disabled { cursor: default; opacity: 0.35; }
      button:focus-visible { outline: 2px solid rgba(201,138,58,0.7); outline-offset: 3px; }

      /* Desktop: a compact player, centered */
      .page { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; gap: 16px; }
      .shell { position: relative; width: 100%; max-width: 460px; height: min(800px, calc(100dvh - 80px)); min-height: 580px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 8px; padding: 22px 18px 20px;
        background: radial-gradient(140% 70% at 50% 30%, #fdfbf6 0%, var(--card) 55%, #f1ebdf 100%);
        border-radius: 36px; box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 30px 60px -20px rgba(70,55,30,0.28), 0 8px 24px -8px rgba(70,55,30,0.14); }

      .bar { position: relative; text-align: center; padding: 0 44px; }
      .info-btn { position: absolute; right: -4px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); transition: color 0.2s; }
      .info-btn:hover { color: var(--ink); }
      .info-btn[data-tip]::after { bottom: auto; top: calc(100% + 6px); left: auto; right: 0; transform: translateY(-4px); }
      @media (hover: hover) { .info-btn[data-tip]:hover::after { transform: none; } }

      /* About the music: a quiet reading page over the player; the music keeps playing */
      .about-wrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
        background: rgba(42,38,32,0.28); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fadein 0.35s ease both; }
      @keyframes fadein { from { opacity: 0; } }
      .about { position: relative; width: 100%; max-width: 600px; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
        background: var(--card); border-radius: 30px; box-shadow: 0 30px 70px -20px rgba(42,38,32,0.45); outline: none; user-select: text; -webkit-user-select: text;
        animation: settle 0.45s ease both; }
      @keyframes settle { from { opacity: 0; transform: translateY(14px); } }
      .about-body { padding: 44px 46px 48px; font-size: 17px; line-height: 1.68; color: var(--ink); }
      .about-body h2 { margin: 0 0 18px; font-weight: 400; font-style: italic; font-size: 30px; line-height: 1.2; }
      .about-body h3 { margin: 34px 0 8px; font-weight: 400; font-style: italic; font-size: 21px; color: var(--ink); }
      .about-body p { margin: 0 0 14px; color: #463f35; }
      .about-body a { color: var(--ink); text-decoration-color: rgba(201,138,58,0.6); text-underline-offset: 3px; }
      .about-close { position: sticky; top: 14px; float: right; margin: 14px 14px 0 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); background: var(--card); box-shadow: 0 0 0 1px rgba(107,99,87,0.14), 0 4px 14px rgba(42,38,32,0.12); z-index: 1; }
      .about-close:hover { color: var(--ink); }
      .brand { margin: 0; font-weight: 400; font-size: 24px; letter-spacing: 0.01em; color: var(--ink); }
      .brand em { font-style: italic; color: var(--ink-2); }

      .stage { position: relative; min-height: 0; margin: 0 -18px; }
      .stage .lines { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .analysis { position: absolute; left: 26px; right: 26px; top: 14px; pointer-events: none; animation: rise 0.6s ease both; }
      @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
      .roman { font-style: italic; font-size: 36px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 14px var(--card), 0 0 4px var(--card); }
      .meta { margin-top: 6px; font-size: 15px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .techs { margin-top: 3px; font-size: 14px; font-style: italic; color: var(--warm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .fcap { position: absolute; left: 26px; right: 26px; bottom: 10px; opacity: 0; transform: translateY(8px); transition: opacity 0.9s ease, transform 0.9s ease; cursor: pointer; pointer-events: none; }
      .stage .lines { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 110px), rgba(0,0,0,0.18) calc(100% - 30px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 110px), rgba(0,0,0,0.18) calc(100% - 30px), transparent); }
      .fcap { z-index: 1; }
      .fcap.on { opacity: 1; transform: none; pointer-events: auto; }
      .fcap-title { font-size: 16px; font-style: italic; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .fcap-body { margin-top: 2px; font-size: 14px; line-height: 1.45; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .fcap.open .fcap-body { -webkit-line-clamp: 12; }

      .pieces { display: flex; justify-content: center; gap: 4px; padding: 6px 0 2px; }
      .piece { position: relative; flex: 1; min-height: 56px; padding: 6px 6px 14px; border-radius: 20px; font-size: 17px; color: var(--ink-3); line-height: 1.15; transition: color 0.4s, background 0.4s; }
      .piece::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--warm); opacity: 0; transform: scale(0.4); transition: opacity 0.4s, transform 0.4s; }
      .piece.on { color: var(--ink); }
      .piece.on::after { opacity: 1; transform: none; }
      .piece:hover:not(:disabled):not(.on) { color: var(--ink-2); }
      .piece.pending::after { animation: pending 0.9s ease-in-out infinite; }
      @keyframes pending { 50% { transform: scale(1.8); opacity: 0.5; } }

      .dock { display: flex; align-items: center; justify-content: center; gap: 26px; padding-top: 6px; }
      .play { width: 82px; height: 82px; border-radius: 50%; display: grid; place-items: center; color: #fbf7ef;
        background: radial-gradient(circle at 35% 30%, #4a4237, var(--ink) 70%); box-shadow: 0 12px 24px -8px rgba(42,38,32,0.5), 0 0 0 6px rgba(201,138,58,0.08); transition: transform 0.15s; }
      .play:active { transform: scale(0.95); }
      .round { position: relative; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2);
        background: rgba(255,253,248,0.7); box-shadow: 0 0 0 1px rgba(107,99,87,0.14), 0 6px 14px -8px rgba(70,55,30,0.3); transition: transform 0.15s, color 0.2s; }
      .round:hover:not(:disabled) { color: var(--ink); }
      .round:active:not(:disabled) { transform: scale(0.95); }
      .round.ending { opacity: 1; color: var(--warm); animation: breathe 1.8s ease-in-out infinite; }
      @keyframes breathe { 50% { box-shadow: 0 0 0 1px rgba(201,138,58,0.4), 0 0 0 10px rgba(201,138,58,0.1); } }
      [data-tip]::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translate(-50%, 4px); white-space: nowrap; font-family: var(--serif); font-style: italic; font-size: 14px; padding: 6px 12px; border-radius: 12px; background: var(--ink); color: #fbf7ef; opacity: 0; pointer-events: none; transition: opacity 0.15s, transform 0.15s; z-index: 2; }
      @media (hover: hover) { [data-tip]:hover::after { opacity: 1; transform: translate(-50%, 0); } }

      .credit { text-align: center; font-size: 12px; color: var(--ink-2); padding: 5px 14px; border-radius: 999px; background: rgba(248,244,236,0.82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
      .bgcredit { white-space: nowrap; }
      @media (max-width: 560px), (max-height: 540px) and (orientation: landscape) { .bgcredit { display: none; } }
      .credit a { color: var(--ink-2); text-decoration-color: rgba(107,99,87,0.35); }

      /* Phones: the player is the whole screen */
      @media (max-width: 560px) {
        .about-wrap { padding: 0; }
        .about { max-width: none; height: 100%; border-radius: 0; }
        .about-body { padding: max(28px, env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom)); font-size: 17px; }
        .about-body h2 { font-size: 27px; padding-right: 40px; }
        .page { padding: 0; gap: 0; justify-content: flex-start; height: 100vh; height: 100dvh; min-height: 0; }
        .shell { max-width: none; flex: 1; height: auto; min-height: 0; border-radius: 0; box-shadow: none; background: var(--card);
          padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); }
        .stage { margin: 0 calc(-1 * max(16px, env(safe-area-inset-right))); }
        .credit { width: 100%; background: var(--card); padding: 0 16px max(10px, env(safe-area-inset-bottom)); border-radius: 0; -webkit-backdrop-filter: none; backdrop-filter: none; font-size: 11px; }
        .piece { font-size: 16px; }
      }
      /* Short screens */
      @media (max-height: 700px) {
        .shell { min-height: 0; }
        .play { width: 68px; height: 68px; }
        .round { width: 50px; height: 50px; }
        .piece { min-height: 48px; }
      }
      /* Landscape phones: waves on the left, controls on the right */
      @media (max-height: 540px) and (orientation: landscape) {
        .page { padding: 0; gap: 0; justify-content: flex-start; height: 100vh; height: 100dvh; min-height: 0; }
        .shell { max-width: none; flex: 1; height: auto; min-height: 0; border-radius: 0; box-shadow: none; background: var(--card);
          grid-template-columns: minmax(0, 1.7fr) minmax(250px, 1fr); grid-template-rows: auto 1fr auto;
          grid-template-areas: "stage bar" "stage pieces" "stage dock"; column-gap: 10px; row-gap: 4px;
          padding: 10px max(14px, env(safe-area-inset-right)) 6px max(14px, env(safe-area-inset-left)); }
        .bar { grid-area: bar; }
        .brand { font-size: 20px; }
        .stage { grid-area: stage; margin: 0; }
        .pieces { grid-area: pieces; flex-direction: column; justify-content: center; }
        .piece { flex: none; min-height: 40px; padding: 4px 6px 4px 22px; text-align: left; font-size: 16px; }
        .piece::after { left: 10px; top: 50%; bottom: auto; margin-top: -3px; margin-left: 0; }
        .dock { grid-area: dock; gap: 18px; }
        .play { width: 60px; height: 60px; }
        .round { width: 46px; height: 46px; }
        .credit { width: 100%; background: var(--card); padding: 0 16px max(4px, env(safe-area-inset-bottom)); border-radius: 0; -webkit-backdrop-filter: none; backdrop-filter: none; font-size: 10px; }
        .roman { font-size: 28px; }
      }

	class DelayLine {
		
		constructor(size, channels) {
			this.buffer = [];
			this.writeHead = []
			this.size = size;

			// create the empty channels
			for (let i = 0; i < channels; i++) {
				this.buffer[i] = new Float32Array(this.size);
				this.writeHead[i] = 0;
			}
		}

		 * Push a value onto the end
		 * @param channel number
		 * @param value number
		 */
		push(channel, value) {
			this.writeHead[channel] += 1;
			if (this.writeHead[channel] > this.size) {
				this.writeHead[channel] = 0;
			}
			this.buffer[channel][this.writeHead[channel]] = value;
		}

		/**
		 * Get the recorded value of the channel given the delay
		 * @param channel number
		 * @param delay number delay samples
		 */
		get(channel, delay) {
			let readHead = this.writeHead[channel] - Math.floor(delay);
			if (readHead < 0) {
				readHead += this.size;
			}
			return this.buffer[channel][readHead];
		}
	}

",body:"The ostinato leaves the bass and rises to the top voice, and the pedal falls silent, so the theme floats up into the light. A dramatic turn Bach also uses in BWV 582."}),organum:()=>({title:"The pipe organ and the North German style",body:"Each note is built additively from a chorus of pipes: 8′, 4′, quint and mixture, with a 16′ in the pedal. Add the chiff of the pipe's speech, the slight unsteadiness of the wind and the long reverberation of a stone church."}),toccata:()=>({title:"Toccata: stylus fantasticus",body:"From toccare, 'to touch': an improvisatory piece that strings together mordents, rushing runs, diminished-seventh arpeggios, dramatic pauses and fermatas. This is the North German fantastic style."}),tocVar:()=>({title:"The opening motif, varied",body:"The very first gesture quotes the archetype from BWV 565 (the 5̂–4̂–5̂ mordent), but each time the engine comes round, the head motif is varied: a Pralltriller, a turn, the upper tonic, a start on the third. In the fantastic style, which lives on improvisation, no player plays the same figure the same way twice."}),dux:()=>({title:"The fugue begins: subject (dux)",body:"One voice alone states the subject. It was generated just now, for this performance only, and everything else in the fugue grows out of it."}),comes:()=>({title:"Answer (comes) and countersubject",body:"The second voice answers with the subject a fifth higher, in the dominant. Meanwhile the first voice plays the countersubject, which will go with the subject from now on."}),episode:()=>({title:"Episode",body:"The head motif of the subject is spun out in sequence, building a bridge to the next entry."}),middleEntry:()=>({title:"Entry in a related key",body:"The subject returns in the relative major. The middle section of a fugue travels through the closely related keys."}),stretto:()=>({title:"Stretto",body:"The next voice starts the subject before the previous one has finished. The entries crowd in on each other and drive the tensi })})}),fe.jsxs("div",{className:"about-body",children:[fe.jsx("h2",{id:"about-title",children:"About the music"}),fe.jsx("p",{children:"Everything you hear is composed while you listen. The program knows the outline of each form and the rules of harmony that Bach worked with, and it makes its own choices within them, so the music never comes out the same way twice."}),fe.jsx("p",{children:"What it writes is in Bach's manner, though it goes about it very differently. Bach planned a piece as a whole, and knew how it would end before he wrote the beginning. The program decides only about one bar ahead of what you hear."}),fe.jsx("h3",{children:"Reading the screen"}),fe.jsx("p",{children:"The three colored lines are the voices: blue for the upper voice, green for the inner voices and amber for the pedal. Time moves from right to left, and each note lights up at the moment you hear it."}),fe.jsx("p",{children:"At the top you see the current chord as a Roman numeral, followed by its function, the key and the bar number, and below that the devices in use at the moment. Now and then a short note about the music appears near the bottom of the picture. Tap it if you would like to read the whole of it."}),fe.jsx("h3",{children:"Toccata and Fugue"}),fe.jsx("p",{children:"The program follows a fixed plan of about twenty bars. It starts in D minor, the key of BWV 565, and each time round it moves a fifth up or down, staying among the neighboring keys. The toccata opens with the mordent from the well-known Toccata in D minor, BWV 565, followed by a falling run and its echo an octave lower. Then come a diminished seventh chord broken over a held pedal note, a long chord under a fermata, a passage in which a high note keeps returning over changing harmonies, and finally a Phrygian cadence."}),fe.jsx("p",{children:"The fugue that follows has a new subject each time round, built from short rhythmic cells and shaped into an arch. A second voice answers it a fifth higher while the first goes on with a countersubject. Episodes spin out the opening of the subject, the subject returns in the pedal and in the relative major, and the fugue ends with a stretto over a held dominant, a cadential trill and a major chord."}),fe.jsx("p",{children:"In Bach's fugues the subject is longer and has more character, the answer is often adjusted so that it stays in the key, and the countersubject is written to fit the subject wherever they meet. The number of voices also stays steady, three or four, over a hundred bars or more. Here the subject lasts a single bar, the countersubject is a free walk in eighth notes, and the whole fugue passes in twelve bars. An organist would also take time in the toccata, lingering on the fermatas and shaping the runs, while the program plays strictly in time."}),fe.jsx("h3",{children:"Chorale Prelude"}),fe.jsxs("p",{children:["This follows the pattern of the Orgelbüchlein, the collection of short chorale preludes Bach wrote in his Weimar years. A hymn tune sings in long notes at the top, an inner voice repeats one small motif, another holds a note, and the pedal walks underneath. The form is the one most Lutheran hymns use: a first phrase, the same phrase again with new ornaments over the same chords, and then a closing phrase. The home key is F minor, the key of ",fe.jsx("i",{children:"Ich ruf zu dir, Herr Jesu Christ"}),", BWV 639, and after each round the music moves a fifth up or down while staying close to it."]}),fe.jsxs("p",{children:["The main difference lies in the tune. Bach always began with a hymn that his congregation knew by heart, and much of the pleasure comes from recognizing it. The program has no hymnbook, so it invents a new melody each time. Bach's motifs also often illustrate the words of the hymn, as in ",fe.jsx("i",{children:"Durch Adams Fall"}),", where the pedal keeps falling. Here the motif is one of four simple shapes, and it stays in the same voice."]}),fe.jsx("h3",{children:"Passacaglia"}),fe.jsx("p",{children:"A passacaglia is a set of variations over a bass line that repeats without change. Here the bass steps down the minor scale and turns back to the fifth at the end, eight notes in all and two to a bar, so each variation lasts four bars. Above it the program chooses from five kinds of variation: flowing eighth notes, running sixteenths, syncopated suspensions, a full chordal passage, and one in which the theme moves up into the top voice. It never picks the same kind twice in a row."}),fe.jsx("p",{children:"The music begins in C minor, the key of Bach's own Passacaglia, and stays there for ten variations, about two and a half minutes, so that the repeating bass has time to settle in. It then moves to E♭ major, then to G minor, and back to C minor, after which the whole round begins again. This plan follows Buxtehude's Passacaglia in D minor, which passes through four blocks of seven statements in D minor, F major, A minor and D minor. Bach knew Buxtehude's organ music well. In the major key the same falling bass loses its sense of lament and sounds calm and open."}),fe.jsx("p",{children:"Bach's Passacaglia in C minor, BWV 582, has a longer theme of eight bars in triple time and twenty variations laid out with great care. The motion grows little by little, many of the variations come in pairs, and the piece closes with a large fugue on the theme. The program has no such long-range plan, and its variations simply follow one another. The registration rises and falls with them, which gives the music some shape."}),fe.jsx("h3",{children:"The sound"}),fe.jsx("p",{children:"The organ is synthesized. Each note is made from several pure tones, in the way an organ stop combines pipes at different pitches, with a little breath of air at the start and the long reverberation of a stone church. The stops change as the music goes along: lighter for the quieter passages, with the full organ kept for the high points and the endings."}),fe.jsx("p",{children:"The tuning is Werckmeister III, a temperament from 1691 in which each key has its own slightly different color, at a′ = 415 Hz, about a semitone below modern pitch. Because of this, each piece keeps to the keys near its home. Further away the intervals grow rough enough to sound out of tune."}),fe.jsx("p",{children:"A real organist shapes the music with small gaps between notes, a slight lingering on important beats and a breath at the cadences. The program plays every note exactly on time and joins it to the next, so it sounds even and a little mechanical."}),fe.jsx("h3",{children:"Ending and saving"}),fe.jsx("p",{children:"The button with the fermata brings the music to a proper close. It slows down, reaches a final cadence and, in a minor key, ends on a major chord."}),fe.jsx("p",{children:"The download button saves what has been played as a MIDI file, from the last time you pressed play up to now. The timing is kept as you heard it, including the slowing down at the end, and there is room for roughly one to two hours of music."}),fe.jsx("h3",{children:"Credits"}),fe.jsxs("p",{children:["This player is based on ",fe.jsx("a",{href:"https://github.com/matsuo-koya/bach-perpetuum",target:"_blank",rel:"noopener",children:"無限バッハ機関 (Bach Perpetuum Mobile)"})," by Kōya Matsuo, published under the MIT license, which he describes in an ",fe.jsx("a",{href:"https://www.techno-edge.net/article/2026/07/23/5327.html",target:"_blank",rel:"noopener",children:"article"})," in Japanese. The way the music is composed and the organ sound are his work. This version is in English and has a new look."]}),fe.jsxs("p",{children:["The page background is Bach's own manuscript of the Adagio from his Sonata in G minor for solo violin, BWV 1001, written in 1720 and kept on ",fe.jsx("a",{href:"https://commons.wikimedia.org/wiki/File:BWV1001_adagio_autograph_manuscript_1720.jpeg",target:"_blank",rel:"noopener",children:"Wikimedia Commons"}),"."]})]})]})}):null}const ac={toccata:{tonic:2,mode:"minor"},chorale:{ton
